
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Lista de tarefas com HTML, CSS e JavaScript."
    >

    <title>Minha To-Do List</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <h1>Minha Lista de Tarefas</h1>

        <p>Organize suas tarefas do dia a dia.</p>

        <form id="form-tarefa">
            <label for="input-tarefa" class="sr-only">
                Nova tarefa
            </label>

            <input
                type="text"
                id="input-tarefa"
                placeholder="Digite uma nova tarefa"
                maxlength="120"
                required
            >

            <button type="submit">
                Adicionar
            </button>
        </form>

        <section class="tarefas">
            <h2>Minhas tarefas</h2>

            <ul id="lista-tarefas"></ul>

            <p id="contador-tarefas" aria-live="polite">
                Você tem 0 tarefas pendentes.
            </p>
        </section>
    </main>

</body>
</html>
